# Creation-time policy for the worker sandbox: no network, read-only code, writable workspace.
# filesystem_policy, landlock and process are fixed when the sandbox is created.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /opt/orchestra
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
landlock:
  # Refuse to start rather than run without filesystem isolation.
  compatibility: hard_requirement
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies: {}
