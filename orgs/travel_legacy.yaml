name: travel_legacy
root: travel_director
domains: [travel_legacy]
teams:
  travel_director:
    members: [planning_lead, booking_lead, support_lead]
    prompt: >-
      너는 Travel Director 다. 요청을 팀 단위로만 분배한다:
      일정 기획(planning_lead) / 예약·결제(booking_lead) / 현지 지원(support_lead).
      일정이 확정되기 전에는 booking_lead 를 호출하지 말고, 팀 결과를 종합해 최종 답을 낸다.
  planning_lead:
    members: [travel_legacy/weather_agent, travel_legacy/restaurant_agent, travel_legacy/attraction_agent]
    prompt: 일정 기획 팀장. 날씨를 먼저 확인하고, 비면 실내 위주 맛집/관광지로 일정 초안을 만든다.
  booking_lead:
    members: [travel_legacy/flight_agent, travel_legacy/hotel_agent, travel_legacy/car_agent]
    prompt: 예약/결제 팀장. 항공 → 숙소 → 렌터카 순으로 예약한다. 사용자가 승인한 항목만 예약.
  support_lead:
    members: [travel_legacy/translation_agent, travel_legacy/emergency_agent]
    prompt: 현지 지원 팀장. 번역과 긴급 연락 요청만 처리한다.
agents:
  travel_legacy/weather_agent:
    id: travel_legacy/weather_agent
    name: weather_agent
    tools: [get_weather, get_hourly_forecast]
    prompt: 날씨/시간대별 예보 담당
  travel_legacy/restaurant_agent:
    id: travel_legacy/restaurant_agent
    name: restaurant_agent
    tools: [search_restaurants, get_menu, check_wait_time]
    prompt: 맛집 담당
  travel_legacy/attraction_agent:
    id: travel_legacy/attraction_agent
    name: attraction_agent
    tools: [search_attractions, get_opening_hours]
    prompt: 관광지 담당
  travel_legacy/flight_agent:
    id: travel_legacy/flight_agent
    name: flight_agent
    tools: [search_flights, check_seat, book_flight]
    prompt: 항공 예약 담당
  travel_legacy/hotel_agent:
    id: travel_legacy/hotel_agent
    name: hotel_agent
    tools: [search_hotels, check_room, book_hotel]
    prompt: 숙소 예약 담당
  travel_legacy/car_agent:
    id: travel_legacy/car_agent
    name: car_agent
    tools: [search_cars, book_car]
    prompt: 렌터카 예약 담당
  travel_legacy/translation_agent:
    id: travel_legacy/translation_agent
    name: translation_agent
    tools: [translate]
    prompt: 번역 담당
  travel_legacy/emergency_agent:
    id: travel_legacy/emergency_agent
    name: emergency_agent
    tools: [get_emergency_contacts]
    prompt: 긴급 연락 담당
