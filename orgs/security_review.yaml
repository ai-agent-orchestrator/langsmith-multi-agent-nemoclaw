name: security_review
domains: [security]
root: security_lead
teams:
  security_lead:
    members: [security/scan, security/policy, security/redteam]
    prompt: Inspect and propose only. Policy application requires a separate human approval workflow.
filters:
  - {name: request_gate, stages: [pre_request], order: 10}
  - {name: pii_mask, stages: [post_tool, pre_response], order: 90}
  - {name: budget, stages: [pre_tool], order: 5, params: {max_tool_calls: 20}}
