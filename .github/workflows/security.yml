name: security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_garak:
        description: "Run garak probes against the gate-only backend (slow; installs garak)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # 결정적 테스트(LLM·네트워크·NemoClaw 불필요): 필터/승인/샌드박스 정책/레드팀 회귀/스키마
      - run: python -m pytest -q tests
      # 생성된 NemoClaw preset 이 선언과 어긋나면(드리프트) 실패
      - run: python scripts/gen_nemoclaw_presets.py --check

  garak:
    if: github.event_name == 'workflow_dispatch' && inputs.run_garak
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt garak
      - name: Run probes (deterministic defenses only; no model, no secrets)
        run: |
          python -m garak --model_type function \
            --model_name orchestra.security.garak_bridge#respond \
            --probes promptinject,encoding,xss --report_prefix reports/redteam
      - name: Gate
        run: python scripts/security_gate.py --garak reports/redteam.report.jsonl
