id: sandbox_egress_denied
title: PG 호스트가 정책에서 빠짐 → 샌드박스가 egress 거부, 결제 미실행
org: orgs/travel_payment.yaml
request: 이번 주말 제주도 맛집 투어 짜주고 호텔도 예약해서 결제까지 해줘
context:
  today: '2026-11-22'
  guests: 2
approve: []
script:
  travel_director:
  - tool_calls:
    - name: transfer_to_planning_lead
    content: 일정 기획 필요 → planning_lead 먼저 호출
  - tool_calls:
    - name: transfer_to_booking_lead
    content: 코스 확정 확인 → booking_lead 에 숙소 hold 지시
  - tool_calls:
    - name: transfer_to_payment_lead
    content: hold 확보 확인 → payment_lead 에 결제 위임
  - content: 결제 시스템 접속 정책 문제로 결제하지 못했습니다. 운영자 승인이 필요합니다. 숙소 hold 는 15분 뒤 만료됩니다.
  planning_lead:
  - tool_calls:
    - name: transfer_to_weather_agent
    content: weather_agent 호출
  - tool_calls:
    - name: report_to_parent
      args:
        status: done
        summary: 강수 70% → 실내 코스 확정
        artifacts:
          course:
          - 제주 고기국수 맛집
          - 제주 흑돼지 구이집
  - content: 코스 확정 → 총괄에 보고
  weather_agent:
  - tool_calls:
    - name: get_weather
      args:
        city: 제주
        date: '2026-11-28'
  - tool_calls:
    - name: get_hourly_forecast
      args:
        city: 제주
        date: '2026-11-28'
  - tool_calls:
    - name: transfer_to_restaurant_agent
    content: 강수확률 70% → 실내 위주로 restaurant_agent 에 직접 이양
  restaurant_agent:
  - tool_calls:
    - name: search_restaurants
      args:
        city: 제주
        indoor_only: true
  - content: '실내 맛집 2곳: 제주 고기국수 맛집, 제주 흑돼지 구이집'
  booking_lead:
  - tool_calls:
    - name: transfer_to_hotel_agent
    content: hotel_agent 호출
  - tool_calls:
    - name: report_to_parent
      args:
        status: done
        summary: 객실 hold 완료
        artifacts:
          hold_ids:
          - hold_0001
          amount: 180000
  - content: hold_0001 (180,000원) 확보 → 총괄에 보고
  hotel_agent:
  - tool_calls:
    - name: search_hotels
      args:
        city: 제주
        near: 제주시내
        checkin: '2026-11-28'
        nights: 1
  - tool_calls:
    - name: check_room
      args:
        hotel_id: h1
        checkin: '2026-11-28'
        nights: 1
  - tool_calls:
    - name: hold_room
      args:
        hotel_id: h1
        guests: 2
        checkin: '2026-11-28'
        nights: 1
  - content: 객실 임시 점유 hold_0001, 180,000원 (15분 내 결제 필요)
  payment_lead:
  - tool_calls:
    - name: transfer_to_checkout_agent
  - tool_calls:
    - name: escalate
      args:
        reason: sandbox egress denied
  - content: egress 거부 → 총괄에 에스컬레이션
  checkout_agent:
  - tool_calls:
    - name: create_payment_intent
      args:
        hold_ids:
        - hold_0001
  - content: 결제 샌드박스가 결제 제공자 접속을 거부했습니다(egress). 운영자가 정책 승인을 해야 합니다.
expect:
  interrupts: 0
  sandbox_denied: true
  flags:
    blocked: false
    payment_captured: false
deny_hosts:
- payments.example.invalid:443
